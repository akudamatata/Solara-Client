name: solara_mobile
description: Native Flutter recreation of the Solara music client backed by the direct Solara API.
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.15
  audio_session: ^0.1.16
  flutter_volume_controller: ^4.0.0
  provider: ^6.1.2
  collection: ^1.18.0
  characters: ^1.3.0
  file_picker: ^6.2.0
  path_provider: ^2.1.3
  share_plus: ^7.2.1
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: SpecialElite
      fonts:
        - asset: fonts/SpecialElite-Regular.ttf
